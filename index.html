<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作文メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f2ea;
    --paper: #fffdf8;
    --ink: #23304a;
    --sub: #6b7385;
    --line: #e3dccd;
    --accent: #2f6fb0;
    --accent-soft: #e6f0fa;
    --ok: #2e8b57;
    --ok-soft: #e7f5ec;
    --red: #e0322f;
    --red-soft: #fdecec;
    --hl: #fff1b8;
    --r-claim: #d9e8fb;    --r-claim-t: #1f5ea8;
    --r-count: #d6f1ee;    --r-count-t: #13756b;
    --r-reason: #dff2df;   --r-reason-t: #2c7a32;
    --r-ex: #f1f6d6;       --r-ex-t: #6a7a12;
    --r-opp: #fde6d4;      --r-opp-t: #b4570f;
    --r-concede: #efe3f8;  --r-concede-t: #7a3fa5;
    --r-rebut: #fbe0e6;    --r-rebut-t: #b02a4b;
    --r-sum: #d9e8fb;      --r-sum-t: #1f5ea8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Meiryo", sans-serif;
    line-height: 1.8;
    -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; }

  /* ルビと翻訳 */
  rt { font-size: .5em; font-weight: 500; }
  body.noruby rt { display: none; }
  .tr {
    display: block; font-size: .82em; font-weight: 400; color: var(--sub); line-height: 1.5;
    margin-top: 2px; font-family: "Segoe UI", "Nirmala UI", "Noto Sans Devanagari", "Helvetica Neue", Arial, sans-serif;
  }
  .btn .tr, .choice .tr, .role-btn .tr, .steps .tr, .toast .tr { color: inherit; opacity: .8; font-size: .75em; }
  .toast .tr { font-size: .85em; }

  header { background: var(--paper); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .head-inner {
    max-width: 1100px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: .05em; }
  h1 small { font-size: .8rem; color: var(--sub); font-weight: 500; margin-left: 8px; }
  .steps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
  .steps li { font-size: .8rem; padding: 3px 10px; border-radius: 12px; background: #eee9df; color: var(--sub); line-height: 1.6; }
  .steps li.active { background: var(--accent); color: #fff; }
  .steps li.done { background: var(--accent-soft); color: var(--accent); }
  .langbar { max-width: 1100px; margin: 8px auto 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: .8rem; color: var(--sub); }
  .tg {
    border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px;
    padding: 3px 12px; font-size: .85rem; cursor: pointer;
  }
  .tg.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tg[lang=ne] { font-family: "Nirmala UI", "Noto Sans Devanagari", sans-serif; }

  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  [hidden] { display: none !important; }

  .card {
    max-width: 680px; margin: 10px auto 0;
    background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px 24px; box-shadow: 0 2px 0 var(--line);
  }
  .card.wide { max-width: 860px; }
  .kicker { color: var(--accent); font-weight: 700; font-size: .95rem; }
  .lead { font-size: 1.3rem; font-weight: 700; margin: 4px 0 14px; line-height: 1.9; }
  .lead .tr { font-size: .7em; }
  .note { color: var(--sub); font-size: .92rem; margin: -6px 0 14px; }

  .btn {
    border: none; border-radius: 10px; padding: 11px 22px; font-size: 1rem; font-weight: 700;
    cursor: pointer; background: var(--accent); color: #fff; text-decoration: none; display: inline-block; line-height: 1.6;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; color: var(--sub); border: 1px solid var(--line); }
  .btn.big { font-size: 1.15rem; padding: 14px 28px; }
  .btn.green { background: var(--ok); }
  .btn:disabled { opacity: .4; cursor: default; }

  /* ---------- ⓪ お手本 ---------- */
  .model-essay {
    font-family: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 1.15rem; line-height: 2.5;
    background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; margin-bottom: 16px;
  }
  .model-essay p { margin: 0 0 6px; text-indent: 1em; }
  .ms { border-radius: 4px; padding: 2px 0; transition: background .2s; }
  .ms.cur { background: var(--hl); box-shadow: 0 0 0 2px #f0d468; }
  .ms .tag {
    display: inline-block; text-indent: 0; font-family: "Zen Maru Gothic", sans-serif; font-size: .7rem; font-weight: 700;
    line-height: 1.5; padding: 0 6px; border-radius: 6px; margin-right: 4px; vertical-align: 2px; color: #fff;
  }
  .ms .tag rt { display: none; }
  .ms .cn { font-weight: 600; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }

  .role-claim   { background: var(--r-claim); }   .role-claim .tag   { background: var(--r-claim-t); }
  .role-count   { background: var(--r-count); }   .role-count .tag   { background: var(--r-count-t); }
  .role-reason  { background: var(--r-reason); }  .role-reason .tag  { background: var(--r-reason-t); }
  .role-ex      { background: var(--r-ex); }      .role-ex .tag      { background: var(--r-ex-t); }
  .role-opp     { background: var(--r-opp); }     .role-opp .tag     { background: var(--r-opp-t); }
  .role-concede { background: var(--r-concede); } .role-concede .tag { background: var(--r-concede-t); }
  .role-rebut   { background: var(--r-rebut); }   .role-rebut .tag   { background: var(--r-rebut-t); }
  .role-sum     { background: var(--r-sum); }     .role-sum .tag     { background: var(--r-sum-t); }

  .role-q { font-weight: 700; margin: 0 0 8px; }
  .roles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .role-btn {
    font-size: 1rem; font-weight: 700; padding: 8px 6px; border-radius: 10px; cursor: pointer;
    border: 2px solid var(--line); background: #fff; color: var(--ink); line-height: 1.6;
  }
  .role-btn:hover { border-color: var(--accent); }
  .role-btn.shake { animation: shake .35s; border-color: var(--red); }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .fb { border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: .98rem; min-height: 1em; }
  .fb.ok { background: var(--ok-soft); border: 2px solid #b5dcc3; }
  .fb.ng { background: var(--red-soft); border: 2px solid #f3b4b2; }
  .model-progress { color: var(--sub); font-size: .9rem; margin-bottom: 6px; }

  .design { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 18px; }
  .design .blk { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; border-radius: 10px; padding: 8px 12px; }
  .design .blk .rn { font-weight: 700; font-size: .9rem; }
  .design .blk .ex { font-family: "Klee One", serif; font-weight: 600; }
  .design .blk .why { font-size: .85rem; color: var(--sub); }
  .design .indent { margin-left: 22px; }
  .design .arrow { text-align: center; color: var(--sub); font-size: .8rem; line-height: 1; }

  /* ---------- ① 質問 ---------- */
  .qprogress { display: flex; gap: 4px; margin-bottom: 18px; }
  .qprogress span { flex: 1; height: 6px; border-radius: 3px; background: #eee9df; }
  .qprogress span.on { background: var(--accent); }
  .qlabel .quote { background: var(--accent-soft); padding: 0 4px; border-radius: 4px; }
  textarea, input[type=text] {
    width: 100%; font: inherit; font-size: 1.1rem; color: var(--ink);
    border: 2px solid var(--line); border-radius: 10px; padding: 12px 14px; background: #fff; resize: vertical;
  }
  textarea:focus, input[type=text]:focus { outline: none; border-color: var(--accent); }
  .choices { display: flex; gap: 14px; }
  .choice {
    flex: 1; font-size: 1.4rem; font-weight: 700; padding: 18px 10px; border-radius: 14px;
    border: 2px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; line-height: 1.7;
  }
  .choice:hover { border-color: var(--accent); }
  .choice.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  .qnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }
  .err { color: var(--red); font-size: .9rem; min-height: 1.4em; margin-top: 6px; }

  /* ---------- ②③④ 作文 ---------- */
  .edit-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .howto { font-size: .9rem; color: var(--sub); margin: 0 0 12px; }
  .howto b { color: var(--ink); }
  .expr-panel { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
  .expr-list { display: flex; flex-direction: column; gap: 8px; }
  .chip {
    text-align: left; font-size: 1rem; line-height: 1.9; padding: 7px 12px; border-radius: 10px;
    border: 2px solid #cfdcec; background: #fff; color: var(--ink); cursor: pointer;
  }
  .chip:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .chip .slot {
    display: inline-block; min-width: 2.2em; text-align: center; margin: 0 2px; line-height: 1.5;
    background: #eef1f5; border: 1px dashed #9aa6b8; border-radius: 4px; color: var(--sub); font-size: .85em;
  }
  .chip .multi { font-size: .72rem; color: var(--sub); margin-left: 6px; }
  .chip .multi .tr { display: inline; margin-left: 4px; }
  .chip:disabled { opacity: .45; cursor: default; text-decoration: line-through; border-style: dashed; }
  .chip:disabled::before { content: "✓ "; color: var(--ok); }
  .panel-tools { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .panel-tools .btn { font-size: .9rem; padding: 6px 14px; }

  .step-title { font-size: 1.05rem; font-weight: 700; margin: 0 0 6px; display: flex; align-items: flex-start; gap: 6px; }
  .step-title .n {
    flex: none; display: inline-flex; align-items: center; justify-content: center; width: 1.6em; height: 1.6em; margin-top: .45em;
    border-radius: 50%; background: var(--accent); color: #fff; font-size: .85rem;
  }
  .editor-wrap { position: relative; }
  #editor {
    background: var(--paper); border: 2px solid var(--line); border-radius: 12px;
    padding: 18px 22px; min-height: 360px;
    font-family: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 1.25rem; line-height: 2.4; outline: none; caret-color: var(--accent); word-break: break-all;
  }
  #editor:focus { border-color: var(--accent); }
  #editor p, #editor div { margin: 0 0 4px; text-indent: 1em; border-bottom: 1px dashed #ebe5d8; }
  .marker {
    position: absolute; width: 3px; background: var(--accent); border-radius: 2px;
    pointer-events: none; animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: .2; } }
  .editor-foot { display: flex; justify-content: space-between; color: var(--sub); font-size: .9rem; margin-top: 6px; gap: 6px; }
  .msg { border-radius: 12px; padding: 12px 40px 12px 14px; margin-bottom: 12px; position: relative; font-size: .98rem; }
  .msg.info { background: var(--accent-soft); border: 2px solid #bcd3ea; }
  .msg .close { position: absolute; right: 8px; top: 6px; border: none; background: none; font-size: 1.3rem; cursor: pointer; color: var(--sub); }
  .finish { margin-top: 18px; }
  .finish ul { margin: 6px 0 14px; padding-left: 1.2em; font-size: .95rem; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 16px; font-size: .95rem;
    z-index: 200; max-width: 90vw; text-align: center;
  }

  /* ---------- モーダル ---------- */
  .modal {
    position: fixed; inset: 0; background: rgba(20,25,40,.6); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-box { background: var(--paper); border-radius: 16px; padding: 20px; max-width: 760px; width: 100%; max-height: 92vh; overflow: auto; }
  .center { text-align: center; }
  .modal-box img { width: 100%; border: 1px solid var(--line); border-radius: 6px; }
  .modal-box .btns { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .modal-box .small { font-size: .9rem; color: var(--sub); margin: 8px 0 0; }

  .join-title { font-size: 1.2rem; font-weight: 700; margin: 0 0 10px; }
  .naive {
    font-family: "Klee One", serif; font-size: 1.2rem; line-height: 2.2;
    background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
  }
  .naive .bad { text-decoration: underline solid var(--red); text-decoration-thickness: 3px; text-underline-offset: 6px; background: var(--red-soft); border-radius: 3px; }
  .warn-line { color: var(--red); font-weight: 700; margin: 10px 0 4px; }
  .warn-line .tr { color: var(--red); opacity: .85; }
  .join-ex { font-family: "Klee One", serif; margin-top: 4px; }
  .join-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 12px 0 0; font-family: "Klee One", serif; font-size: 1.2rem; }
  .join-row .fixed { background: #eef1f5; border-radius: 6px; padding: 4px 8px; color: var(--sub); }
  .join-row input { flex: 1 1 260px; font-family: "Klee One", serif; font-size: 1.2rem; }
  .join-preview { margin-top: 10px; font-size: .9rem; color: var(--sub); }
  .join-preview .val { font-family: "Klee One", serif; color: var(--ink); font-size: 1.05rem; }

  footer { text-align: center; color: var(--sub); font-size: .8rem; padding-bottom: 20px; }
  footer button { background: none; border: none; color: var(--sub); text-decoration: underline; cursor: pointer; font-size: .8rem; }

  @media (max-width: 820px) {
    .steps .tr { display: none; }
    .steps li { font-size: .72rem; padding: 2px 8px; }
    .edit-layout { grid-template-columns: 1fr; }
    .expr-panel {
      position: sticky; top: auto; bottom: 0; z-index: 10; order: 2;
      max-height: 38vh; border-radius: 14px 14px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.08); padding: 10px 12px;
    }
    .expr-panel .howto { display: none; }
    .expr-panel .step-title { font-size: .95rem; margin-bottom: 6px; }
    .expr-list { flex-direction: row; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: .88rem; padding: 3px 9px; }
    .chip:disabled { display: none; }
    .panel-tools { margin-top: 8px; }
    .panel-tools .btn { font-size: .8rem; padding: 4px 10px; }
    #editor { font-size: 1.1rem; padding: 14px 16px; }
    .lead { font-size: 1.15rem; }
    .card { padding: 22px 16px; }
    .roles { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .role-btn { font-size: .85rem; padding: 6px 2px; }
    #roleBox {
      position: sticky; bottom: 0; z-index: 5; background: var(--paper);
      margin: 0 -16px -22px; padding: 10px 12px 12px; border-top: 1px solid var(--line);
      box-shadow: 0 -4px 12px rgba(0,0,0,.06);
    }
    #roleBox .role-q { margin-bottom: 6px; font-size: .95rem; }
    #roleBox .fb { margin-top: 8px; font-size: .88rem; padding: 6px 10px; }
    .model-essay { font-size: 1.05rem; padding: 12px 14px; }
    .design .blk { grid-template-columns: 1fr; gap: 2px; }
    .design .indent { margin-left: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <h1><span data-t="title"></span><small data-t="subtitle"></small></h1>
    <ol class="steps" id="steps">
      <li data-t="step1"></li>
      <li data-t="step2"></li>
      <li data-t="step3"></li>
      <li data-t="step4"></li>
    </ol>
  </div>
  <div class="langbar">
    <button type="button" class="tg" id="rubyBtn">ふりがな</button>
    <span>|</span>
    <button type="button" class="tg" data-lang="en" lang="en">English</button>
    <button type="button" class="tg" data-lang="ne" lang="ne">नेपाली</button>
  </div>
</header>

<main>
  <!-- ⓪ お手本の分解 -->
  <section id="screenM">
    <div class="card wide">
      <div class="kicker" data-t="m_kicker"></div>
      <div class="lead" data-t="m_lead"></div>
      <p class="note" data-t="m_note"></p>
      <div id="modelEssay" class="model-essay"></div>
      <div id="roleBox">
        <div class="model-progress" id="modelProgress"></div>
        <p class="role-q" data-t="m_q"></p>
        <div class="roles" id="roles"></div>
        <div class="fb" id="roleFb" hidden></div>
      </div>
      <div id="modelDone" hidden>
        <p class="lead" style="margin-top:6px" data-t="m_done"></p>
        <p class="note" data-t="m_done_note"></p>
        <div class="design" id="designMain"></div>
        <div class="center"><button class="btn big" id="toQ" data-t="toQ"></button></div>
      </div>
    </div>
  </section>

  <!-- ① 一問一答 -->
  <section id="screenQ" hidden>
    <div class="card">
      <div class="qprogress" id="qprogress"></div>
      <div class="kicker" id="qnum"></div>
      <div class="lead qlabel" id="qlabel"></div>
      <div class="note" id="qhint"></div>
      <div id="qinput"></div>
      <div class="err" id="qerr"></div>
      <div class="qnav">
        <button class="btn ghost" id="qback"></button>
        <button class="btn" id="qnext"></button>
      </div>
    </div>
  </section>

  <!-- ②③④ 作文 -->
  <section id="screenE" hidden>
    <div class="edit-layout">
      <div class="editor-col">
        <p class="step-title"><span class="n">2</span><span data-t="e_title2"></span></p>
        <p class="howto" data-t="e_howto"></p>
        <div id="msg" class="msg" hidden></div>
        <div class="editor-wrap" id="editorWrap">
          <div id="editor" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off"></div>
          <div class="marker" id="marker" hidden></div>
        </div>
        <div class="editor-foot"><span id="count"></span></div>

        <div class="panel finish">
          <p class="step-title"><span class="n">4</span><span data-t="e_title4"></span></p>
          <ul>
            <li data-t="e_fin1"></li>
            <li data-t="e_fin2"></li>
          </ul>
          <button class="btn big green" id="exportBtn" data-t="btn_export"></button>
        </div>
      </div>

      <aside class="panel expr-panel" id="exprPanel">
        <p class="step-title"><span class="n">3</span><span data-t="e_title3"></span></p>
        <p class="howto" data-t="e_howto3"></p>
        <div class="expr-list" id="exprList"></div>
        <div class="panel-tools">
          <button class="btn ghost" id="undoBtn" data-t="btn_undo"></button>
          <button class="btn ghost" id="showDesign" data-t="btn_design"></button>
          <button class="btn ghost" id="backToQ" data-t="btn_backQ"></button>
        </div>
      </aside>
    </div>
  </section>
</main>

<footer><button id="resetBtn" data-t="reset"></button></footer>

<!-- つなぐ練習 -->
<div class="modal" id="joinModal" hidden>
  <div class="modal-box">
    <p class="join-title" data-t="j_title"></p>
    <div data-t="j_result"></div>
    <div class="naive" id="naive"></div>
    <div class="warn-line" data-t="j_warn"></div>
    <div id="joinRule"></div>
    <div class="join-row">
      <span class="fixed" id="joinPre"></span>
      <input type="text" id="joinInput" autocomplete="off">
      <span class="fixed" id="joinSuf"></span>
    </div>
    <div class="join-preview"><span data-t="j_done"></span> <span class="val" id="joinPreview"></span></div>
    <div class="fb" id="joinFb" hidden></div>
    <div class="btns">
      <button class="btn green" id="joinCheck" data-t="j_check"></button>
      <button class="btn ghost" id="joinCancel" data-t="j_cancel"></button>
    </div>
  </div>
</div>

<!-- 設計図 -->
<div class="modal" id="designModal" hidden>
  <div class="modal-box">
    <p class="join-title" data-t="btn_design"></p>
    <div class="design" id="designSub"></div>
    <div class="btns"><button class="btn" id="closeDesign" data-t="close"></button></div>
  </div>
</div>

<!-- 画像 -->
<div class="modal" id="modal" hidden>
  <div class="modal-box center">
    <img id="outImg" alt="完成した作文">
    <p class="small" data-t="i_hint"></p>
    <div class="btns">
      <a class="btn green" id="dlLink" download="sakubun.png" data-t="i_save"></a>
      <button class="btn ghost" id="closeModal" data-t="i_back"></button>
    </div>
  </div>
</div>

<script>
(() => {

  const RUBY_RE = /\{([^|{}]+)\|([^{}]+)\}/g;

  function fillVars(str, vars, lang, html) {

      let v = vars ? vars[k] : '';
      if (v == null) v = '';
      if (typeof v === 'object') {
        v = v[lang] != null ? v[lang] : v.ja;
        return html ? (lang === 'ja' ? ruby(v) : esc(v)) : plain(v);
      }
      return html ? esc(String(v)) : String(v);
    });

    let active = 0;
    if (state.screen === 'q') active = 1;
    if (state.screen === 'e') active = EXPRS.every((x, i) => x.multi || state.used.includes(i)) ? 3 : 2;
    for (let i = 0; i < lis.length; i++) lis[i].className = i < active ? 'done' : i === active ? 'active' : '';
  }

  function rerender() {
    if (state.screen === 'm') renderModel(true);
    if (state.screen === 'q') renderQ(true);
    if (state.screen === 'e') {
      renderExprs(); updateCounts();
      if (!$('msg').hidden && $('msg').dataset.key) showMsg($('msg').dataset.key);
    }
    renderSteps();
  }

  function showScreen() {
    $('screenM').hidden = state.screen !== 'm';
    $('screenQ').hidden = state.screen !== 'q';
    $('screenE').hidden = state.screen !== 'e';
    if (state.screen === 'e' && !editor.innerHTML && state.html) editor.innerHTML = state.html;
    rerender();
    window.scrollTo(0, 0);
  }

  /* ================= ⓪ お手本 ================= */
  function sentenceHtml(i, labeled) {
    const m = MODEL[i];
    let src = m.t;
    if (labeled) m.cn.forEach(c => { src = src.replace(c, `<span class="cn">${c}</span>`); });
    const tag = labeled ? `<span class="tag">${ruby(ROLES[m.role].name.ja)}</span>` : '';
    const cls = ['ms'];
    if (labeled) cls.push('role-' + m.role);
    else if (i === state.mi) cls.push('cur');
    return `<span class="${cls.join(' ')}" data-i="${i}">${tag}${ruby(src)}</span>`;
  }

  let lastFb = null;
  function renderModel(keepFb) {
    $('modelEssay').innerHTML = MODEL_PARAS.map(p =>
      `<p>${p.map(i => sentenceHtml(i, i < state.mi)).join('')}</p>`).join('');
    const done = state.mi >= MODEL.length;
    $('roleBox').hidden = done;
    $('modelDone').hidden = !done;
    if (done) { $('designMain').innerHTML = designHtml(); return; }
    $('modelProgress').textContent = `${state.mi + 1} / ${MODEL.length}`;
    $('roles').innerHTML = ROLE_ORDER.map(r => `<button type="button" class="role-btn" data-r="${r}">${tr(ROLES[r].name)}</button>`).join('');
    $('roles').querySelectorAll('.role-btn').forEach(b => b.onclick = () => answerRole(b));
    if (keepFb && lastFb) showRoleFb(lastFb);
    const cur = $('modelEssay').querySelector('.ms.cur');
    if (!keepFb && cur && cur.scrollIntoView && innerWidth < 820) cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function showRoleFb(fb) {
    const box = $('roleFb');
    box.hidden = false;
    box.className = 'fb ' + (fb.ok ? 'ok' : 'ng');
    const m = MODEL[fb.i];
    box.innerHTML = fb.ok
      ? tr('m_ok', { role: ROLES[m.role].name }) + tr(m.why)
      : tr('m_ng', { h: ROLES[m.role].hint });
  }

  function answerRole(btn) {
    const i = state.mi, m = MODEL[i];
    if (btn.dataset.r === m.role) {
      lastFb = { ok: true, i };
      state.mi++;
      save();
      renderModel();
      if (state.mi < MODEL.length) showRoleFb(lastFb);
    } else {
      lastFb = { ok: false, i };
      showRoleFb(lastFb);
      btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
    }
  }

  function designHtml() {
    return DESIGN.map((d, i) =>
      (i ? '<div class="arrow">▼</div>' : '') +
      `<div class="blk role-${d.role}${d.indent ? ' indent' : ''}">
         <div class="rn">${tr(ROLES[d.role].name)}${d.note ? ' <small>' + d.note + '</small>' : ''}</div>
         <div><div class="ex">${ruby(d.ex)}</div><div class="why">${tr(d.why)}</div></div>
       </div>`).join('');
  }

  $('toQ').onclick = () => { state.screen = 'q'; save(); showScreen(); };
  $('showDesign').onclick = () => { $('designSub').innerHTML = designHtml(); $('designModal').hidden = false; };
  $('closeDesign').onclick = () => { $('designModal').hidden = true; };

  /* ================= ① 一問一答 ================= */
  const reasonQ = n => ({
    label: () => n === 1 ? tr('q_reason1', { st: stanceVar(stance()) }) : tr('q_reasonN', { n: ORD[n] }),
    hint: 'hint_one'
  });
  const exampleQ = (n, ri) => ({
    label: () => tr('q_ex', { n: ORD[n], r: trimEnd(V(ri)) }),
    hint: 'hint_ex'
  });
  const QUESTIONS = [
    { short: true, label: () => tr('q_name') },
    { choice: true, label: () => tr('q_stance') },
    reasonQ(1), exampleQ(1, 2),
    reasonQ(2), exampleQ(2, 4),
    reasonQ(3), exampleQ(3, 6),
    { label: () => tr('q_opp', { op: stanceVar(oppWord()) }) },
    { label: () => tr('q_concede', { o: trimEnd(V(8)) }), hint: 'hint_concede' },
    { label: () => tr('q_rebut', { st: stanceVar(stance()), o: trimEnd(V(8)) }) }
  ];

  function renderQ(keepFocus) {
    const qi = state.qi, q = QUESTIONS[qi];
    $('qprogress').innerHTML = QUESTIONS.map((_, i) => `<span class="${i <= qi ? 'on' : ''}"></span>`).join('');
    $('qnum').innerHTML = qi === 0 ? tr('q_intro') : tr('q_num', { n: String(qi), t: String(QUESTIONS.length - 1) });
    $('qlabel').innerHTML = q.label();
    $('qhint').innerHTML = q.hint ? tr(q.hint) : '';
    $('qerr').innerHTML = '';
    $('qback').innerHTML = tr(qi === 0 ? 'btn_backModel' : 'btn_back');
    $('qnext').innerHTML = tr(qi === QUESTIONS.length - 1 ? 'btn_arrange' : 'btn_next');

    const box = $('qinput');
    const prev = $('qtext');
    if (keepFocus && prev && box.contains(prev)) return renderSteps();
    if (q.choice) {
      box.innerHTML = `<div class="choices">${['賛成', '反対'].map(o =>
        `<button type="button" class="choice${state.vals[qi] === o ? ' sel' : ''}" data-v="${o}">${tr({ ja: STANCE[o].ja, en: STANCE[o].btn.en, ne: STANCE[o].btn.ne })}</button>`).join('')}</div>`;
      box.querySelectorAll('.choice').forEach(b => b.onclick = () => { state.vals[qi] = b.dataset.v; save(); renderQ(); });
    } else {
      box.innerHTML = q.short ? '<input type="text" id="qtext" autocomplete="off" maxlength="30">' : '<textarea id="qtext" rows="3"></textarea>';
      const t = $('qtext');
      t.value = state.vals[qi];
      t.oninput = () => { state.vals[qi] = t.value; save(); };
      t.onkeydown = e => {
        if (e.key === 'Enter' && (q.short || e.ctrlKey || e.metaKey) && !e.isComposing) { e.preventDefault(); nextQ(); }
      };
      setTimeout(() => t.focus(), 0);
    }
    renderSteps();
  }

  function nextQ() {
    const qi = state.qi;
    if (!V(qi)) {
      $('qerr').innerHTML = tr(QUESTIONS[qi].choice ? 'err_choice' : 'err_text');
      return;
    }
    if (qi < QUESTIONS.length - 1) { state.qi++; save(); renderQ(); window.scrollTo(0, 0); return; }
    buildEssay();
  }
  $('qnext').onclick = nextQ;
  $('qback').onclick = () => {
    if (state.qi > 0) { state.qi--; save(); renderQ(); }
    else { state.screen = 'm'; save(); showScreen(); }
  };

  /* ================= ② 答えをならべる ================= */
  function buildEssay() {
    if (state.html && !confirm(tp('c_rebuild'))) return;
    const s = i => withPeriod(V(i));
    const paras = [stance(), s(2) + s(3), s(4) + s(5), s(6) + s(7), s(8) + s(9) + s(10)];
    editor.innerHTML = paras.map(l => `<p>${esc(l)}</p>`).join('');
    state.used = [];
    undoStack.length = 0;
    savedRange = null;
    state.screen = 'e';
    save();
    showScreen();
    showMsg('e_msg');
  }

  $('backToQ').onclick = () => { state.screen = 'q'; state.qi = 1; save(); hideMarker(); showScreen(); };

  /* ================= ③ 表現リスト ================= */
  function chipHtml(x) {
    const label = x.r.split('【1の回答】').join(stance() ? stanceVar(stance()).ja : '');
    return ruby(label).replace('～', '<span class="slot">～</span>') +
      (x.multi ? `<span class="multi">${tr('multi')}</span>` : '');
  }
  function renderExprs() {
    const list = $('exprList');
    list.innerHTML = '';
    state.order.forEach(i => {
      const x = EXPRS[i];
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.disabled = !x.multi && state.used.includes(i);
      b.innerHTML = chipHtml(x);
      b.addEventListener('pointerdown', e => e.preventDefault());
      b.addEventListener('mousedown', e => e.preventDefault());
      b.onclick = () => insertExpr(i);
      list.appendChild(b);
    });
    renderSteps();
  }

  let savedRange = null;
  document.addEventListener('selectionchange', () => {
    const sel = getSelection();
    if (!sel.rangeCount) return;
    const r = sel.getRangeAt(0);
    if (editor.contains(r.startContainer)) { savedRange = r.cloneRange(); hideMarker(); }
  });
  editor.addEventListener('blur', () => setTimeout(showMarker, 0));
  editor.addEventListener('focus', hideMarker);
  window.addEventListener('resize', () => { if (document.activeElement !== editor) showMarker(); });

  function showMarker() {
    const m = $('marker');
    if (!savedRange || state.screen !== 'e' || !editor.contains(savedRange.startContainer) || !$('joinModal').hidden) { m.hidden = true; return; }
    const r = savedRange.cloneRange(); r.collapse(true);
    let rect = r.getClientRects()[0];
    if (!rect) {
      const n = r.startContainer.nodeType === 1 ? (r.startContainer.childNodes[r.startOffset] || r.startContainer) : r.startContainer.parentNode;
      if (n && n.getBoundingClientRect) rect = n.getBoundingClientRect();
    }
    if (!rect || (!rect.height && !rect.width)) { m.hidden = true; return; }
    const wrap = $('editorWrap').getBoundingClientRect();
    const h = Math.max(rect.height, 24);
    m.style.left = (rect.left - wrap.left - 1) + 'px';
    m.style.top = (rect.top - wrap.top + (rect.height - h) / 2) + 'px';
    m.style.height = h + 'px';
    m.hidden = false;
  }
  function hideMarker() { $('marker').hidden = true; }

  // カーソル位置 → { 段落, 段落の中の文字の位置 }
  function locate(node, off) {
    if (node === editor) {
      const kids = editor.childNodes;
      if (!kids.length) { const p = document.createElement('p'); editor.appendChild(p); return { p, offset: 0 }; }
      if (off < kids.length) { node = kids[off]; off = 0; }
      else { node = kids[kids.length - 1]; off = node.nodeType === 3 ? node.data.length : node.childNodes.length; }
    }
    let blk = node;
    while (blk && blk.parentNode !== editor) blk = blk.parentNode;
    if (!blk) return null;
    if (blk.nodeType === 3 || !/^(P|DIV)$/.test(blk.tagName)) {
      const p = document.createElement('p');
      editor.insertBefore(p, blk);
      p.appendChild(blk);
      blk = p;
    }
    const r = document.createRange();
    r.setStart(blk, 0);
    r.setEnd(node, off);
    return { p: blk, offset: r.toString().length };
  }

  function setCaret(p, off) {
    const w = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
    let n, acc = 0, last = null, placed = false;
    const r = document.createRange();
    while ((n = w.nextNode())) {
      last = n;
      if (acc + n.data.length >= off) { r.setStart(n, off - acc); placed = true; break; }
      acc += n.data.length;
    }
    if (!placed) { if (last) r.setStart(last, last.data.length); else r.setStart(p, 0); }
    r.collapse(true);
    savedRange = r.cloneRange();
    if (document.activeElement === editor) { const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    else showMarker();
  }

  const END = /[。！？!?]/;
  // カーソルの後ろの1文（文の終わりならその文）の範囲
  function targetSentence(T, c) {
    const rel = T.slice(c).search(END);
    let end = rel < 0 ? T.length : c + rel + 1;
    if (!T.slice(c, end).trim()) {
      end = c;
      while (end > 0 && /\s/.test(T[end - 1])) end--;
      let i = end - 2;
      while (i >= 0 && !END.test(T[i])) i--;
      c = i + 1;
    }
    while (c < end && /\s/.test(T[c])) c++;
    while (end > c && /\s/.test(T[end - 1])) end--;
    return end > c ? { start: c, end } : null;
  }

  const undoStack = [];
  function pushUndo() {
    undoStack.push({ html: editor.innerHTML, used: state.used.slice() });
    if (undoStack.length > 30) undoStack.shift();
  }
  $('undoBtn').onclick = () => {
    const u = undoStack.pop();
    if (!u) { toast('t_noUndo'); return; }
    editor.innerHTML = u.html;
    state.used = u.used;
    savedRange = null;
    hideMarker(); hideMsg();
    renderExprs(); updateCounts(); save();
  };

  function markUsed(i) {
    if (!state.used.includes(i)) state.used.push(i);
    renderExprs(); updateCounts(); save();
  }

  function insertExpr(i) {
    if (!savedRange || !editor.contains(savedRange.startContainer)) { toast('t_clickFirst'); return; }
    const loc = locate(savedRange.startContainer, savedRange.startOffset);
    if (!loc) return;
    const T0 = loc.p.textContent;
    const expr = EXPRS[i].t.split('【1の回答】').join(stance());

    if (!expr.includes('～')) {
      pushUndo();
      loc.p.textContent = T0.slice(0, loc.offset) + expr + T0.slice(loc.offset);
      setCaret(loc.p, loc.offset + expr.length);
      toast('t_inserted', { x: expr });
      markUsed(i);
      return;
    }

    const rng = targetSentence(T0, loc.offset);
    if (!rng) { toast('t_noTarget'); return; }
    const [pre, suf] = expr.split('～');
    const target = T0.slice(rng.start, rng.end);

    if (EXPRS[i].stanceSlot) {
      const word = target.replace(/[。．.！!？?\s]+$/, '').replace(/(です|だ)$/, '');
      if (word !== stance()) { toast('t_stanceWhere', { st: stance() }); return; }
      pushUndo();
      const sentence = pre + stance() + suf;
      loc.p.textContent = T0.slice(0, rng.start) + sentence + T0.slice(rng.end);
      setCaret(loc.p, rng.start + sentence.length);
      toast('t_stanceIn', { st: stance() });
      markUsed(i);
      return;
    }

    const preStr = pre && !/[、，。]$/.test(pre) ? pre + '、' : pre;
    openJoin(preStr, target, suf, inner => {
      pushUndo();
      loc.p.textContent = T0.slice(0, rng.start) + preStr + inner + suf + T0.slice(rng.end);
      setCaret(loc.p, rng.start + preStr.length + inner.length + suf.length);
      markUsed(i);
    });
  }

  /* ================= つなぐ練習 ================= */
  let joinCtx = null;

  function openJoin(pre, target, suf, onOK) {
    joinCtx = { pre, suf, onOK, tries: 0 };
    const em = target.match(/(?:ませんでした|でしょう|ました|ません|でした|ます|です)?[。！？!?]?$/);
    let k = em[0].length;
    if (k <= 1) k = Math.min(target.length, k + 1);
    $('naive').innerHTML = esc(pre + target.slice(0, target.length - k)) +
      `<span class="bad">${esc(target.slice(target.length - k) + suf)}</span>`;
    const rule = JOIN_RULES.find(r => r.test.test(suf));
    $('joinRule').innerHTML = rule
      ? tr('j_rule', { w: rule.word }) +
        `<div class="join-ex">れい：<s style="color:var(--red)">${esc(rule.bad)}</s> → <b style="color:var(--ok)">${esc(rule.good)}</b></div>`
      : tr('j_generic');
    $('joinPre').textContent = pre;
    $('joinPre').hidden = !pre;
    $('joinSuf').textContent = suf;
    const input = $('joinInput');
    input.value = target;
    $('joinFb').hidden = true;
    updateJoinPreview();
    hideMarker();
    $('joinModal').hidden = false;
    setTimeout(() => { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 0);
  }

  function updateJoinPreview() {
    if (!joinCtx) return;
    $('joinPreview').textContent = joinCtx.pre + $('joinInput').value.trim() + joinCtx.suf;
  }
  $('joinInput').addEventListener('input', updateJoinPreview);
  $('joinInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); checkJoin(); }
  });

  function judgeJoin(inner, pre, suf) {
    if (inner.length < 2) return 'jm_short';
    if (/[。．.！!？?]$/.test(inner)) return 'jm_period';
    if (/[、，]$/.test(inner)) return 'jm_comma';
    if (/(ます|ません|ました|ませんでした|です|でした|でしょう)$/.test(inner)) return 'jm_masu';
    if (/^こと/.test(suf) && /だ$/.test(inner) && !/[んい]だ$/.test(inner)) return 'jm_da';
    if (/(わたし|私)は、?$/.test(pre) && /^(わたし|私)は/.test(inner)) return 'jm_watashi';
    return null;
  }

  function checkJoin() {
    if (!joinCtx) return;
    const inner = $('joinInput').value.trim();
    const ng = judgeJoin(inner, joinCtx.pre, joinCtx.suf);
    const fb = $('joinFb');
    fb.hidden = false;
    if (ng) {
      joinCtx.tries++;
      fb.className = 'fb ng';
      fb.innerHTML = tr(ng) + (joinCtx.tries >= 3 ? `<small>${tr('j_ask')}</small>` : '');
      return;
    }
    fb.className = 'fb ok';
    fb.innerHTML = tr('j_ok');
    const ctx = joinCtx;
    joinCtx = null;
    setTimeout(() => { $('joinModal').hidden = true; ctx.onOK(inner); }, 700);
  }
  $('joinCheck').onclick = checkJoin;
  $('joinCancel').onclick = () => { joinCtx = null; $('joinModal').hidden = true; showMarker(); };

  /* ================= メッセージ ================= */
  function showMsg(key) {
    const box = $('msg');
    box.dataset.key = key;
    box.className = 'msg info';
    box.innerHTML = tr(key) + '<button class="close" aria-label="とじる">×</button>';
    box.hidden = false;
    box.querySelector('.close').onclick = hideMsg;
  }
  function hideMsg() { $('msg').hidden = true; }

  let toastTimer;
  function toast(key, vars) {
    let t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.innerHTML = tr(key, vars);
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, ui.lang ? 4500 : 3000);
  }

  /* ================= ④ 完成 ================= */
  editor.addEventListener('input', () => { updateCounts(); save(); });
  editor.addEventListener('paste', e => {
    e.preventDefault();
    document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain'));
  });
  editor.addEventListener('drop', e => e.preventDefault());

  function essayParagraphs() {
    return Array.from(editor.childNodes).map(n => (n.textContent || '').replace(/\s+/g, ' ').trim()).filter(Boolean);
  }
  const countChars = paras => paras.join('').replace(/\s/g, '').length;
  function updateCounts() { $('count').innerHTML = tr('count', { n: String(countChars(essayParagraphs())) }); }

  $('exportBtn').onclick = async () => {
    const unused = EXPRS.filter((x, i) => !x.multi && !state.used.includes(i)).length;
    if (unused && !confirm(tp('c_unused', { n: String(unused) }))) return;
    const paras = essayParagraphs();
    if (!paras.length) { toast('t_empty'); return; }
    const url = await drawEssay(paras);
    $('outImg').src = url;
    $('dlLink').href = url;
    $('dlLink').download = `作文_${V(0) || 'なまえ'}.png`;
    $('modal').hidden = false;
  };
  $('closeModal').onclick = () => { $('modal').hidden = true; };

  async function drawEssay(paras) {
    const title = '子どものSNS利用について';
    const name = V(0);
    const W = 1240, M = 100, FS = 36, LH = 76;
    const serif = '"Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif';
    const bodyFont = `400 ${FS}px ${serif}`;
    const titleFont = `600 52px ${serif}`;
    const nameFont = `400 32px ${serif}`;
    const all = title + name + paras.join('') + '名前：字（）0123456789';
    try {
      await Promise.all([document.fonts.load(bodyFont, all), document.fonts.load(titleFont, title), document.fonts.load(nameFont, all)]);
    } catch (e) {}

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    ctx.font = bodyFont;
    const lines = [];
    paras.forEach(p => wrapText(ctx, '　' + p, W - M * 2).forEach(l => lines.push(l)));

    const headH = 250;
    const H = Math.max(Math.round(W * 1.414), headH + lines.length * LH + 160);
    canvas.width = W;
    canvas.height = H;
    ctx.fillStyle = '#fffdf8';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#d8d0bf';
    ctx.lineWidth = 2;
    ctx.strokeRect(40, 40, W - 80, H - 80);

    ctx.fillStyle = '#23304a';
    ctx.font = titleFont;
    ctx.textAlign = 'center';
    ctx.fillText(title, W / 2, 150);
    ctx.font = nameFont;
    ctx.textAlign = 'right';
    ctx.fillText(`名前：${name}`, W - M, 215);
    ctx.textAlign = 'left';

    const totalLines = Math.floor((H - headH - 120) / LH);
    ctx.strokeStyle = '#c9d6e6';
    ctx.lineWidth = 1.5;
    for (let i = 0; i <= totalLines; i++) {
      const y = headH + i * LH + 0.5;
      ctx.beginPath(); ctx.moveTo(M, y); ctx.lineTo(W - M, y); ctx.stroke();
    }
    ctx.fillStyle = '#23304a';
    ctx.font = bodyFont;
    lines.forEach((l, i) => ctx.fillText(l, M, headH + (i + 1) * LH - 20));

    ctx.font = '400 26px "Zen Maru Gothic", sans-serif';
    ctx.fillStyle = '#6b7385';
    ctx.textAlign = 'right';
    ctx.fillText(`（${countChars(paras)}字）`, W - M, H - 70);
    return canvas.toDataURL('image/png');
  }

  function wrapText(ctx, text, maxW) {
    const lines = [];
    let line = '';
    for (const ch of Array.from(text)) {
      const test = line + ch;
      if (line && ctx.measureText(test).width > maxW) {
        if (/[、。，．！？」』）)!?]/.test(ch)) { lines.push(test); line = ''; continue; }
        lines.push(line);
        line = ch;
      } else line = test;
    }
    if (line) lines.push(line);
    return lines;
  }

  $('resetBtn').onclick = () => {
    if (!confirm(tp('c_reset'))) return;
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    location.reload();
  };

  applyStatic();
  showScreen();
})();
</script>
</body>
</html>
